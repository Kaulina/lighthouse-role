- name: Install required packages
  ansible.builtin.apt:
    name:
      - nginx
      - unzip
    state: present
    update_cache: true

- name: Create lighthouse directory
  ansible.builtin.file:
    path: "{{ lighthouse_root }}"
    state: directory
    mode: "0755"

- name: Download Lighthouse archive
  ansible.builtin.get_url:
    url: "{{ lighthouse_download_url }}"
    dest: /tmp/lighthouse.zip
    mode: "0644"

- name: Unpack Lighthouse
  ansible.builtin.unarchive:
    src: /tmp/lighthouse.zip
    dest: /tmp
    remote_src: true

- name: Copy Lighthouse files
  ansible.builtin.copy:
    src: /tmp/lighthouse-master/
    dest: "{{ lighthouse_root }}/"
    remote_src: true
    mode: preserve

- name: Deploy nginx config
  ansible.builtin.template:
    src: lighthouse.conf.j2
    dest: "{{ nginx_site_path }}"
    mode: "0644"
  notify: Restart nginx

- name: Enable Lighthouse site
  ansible.builtin.file:
    src: "{{ nginx_site_path }}"
    dest: "{{ nginx_site_link }}"
    state: link
  notify: Restart nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
